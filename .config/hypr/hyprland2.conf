exec-once = /usr/lib/pam_kwallet_init
exec-once = sleep 10 & kstart plasmashell
exec-once = $terminal --detach=yes --hold sh -c  "watch -n 15 kbuildsycoca6 --noincremental 1>/dev/null 2>/dev/null & disown"
exec-once = nm-applet &
exec-once = clearCaches1
exec-once = clearCaches2
exec-once = hyprmod
exec-once = anyrun daemon
exec-once = hyprpm reload -n
exec-once = hyprpaper & yakuake & vivaldi #google-chrome-stable & vivaldi
# removed from marvel  PROTON_USE_NTSYNC=1 PROTON_FSR4_UPGRADE=1 PROTON_NO_ESYNC=1 PROTON_NO_FSYNC=1 RADV_PERFTEST=rt,wave32,rt_timeout=100000 ENABLE_LAYER_MESA_ANTI_LAG=1 PROTON_ENABLE_WAYLAND=1 __GL_SHADER_DISK_CACHE_SIZE=10737418240 PROTON_FSR4_UPGRADE=1
$cacheclear = rm ~/.cache/icon-cache.kcache && rm -rf ~/.cache/plasmashell* && kbuildsycoca6 --noincremental

# Clipboard: history
